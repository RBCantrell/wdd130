<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
          <h2>My Favorite Devotionals</h2>
        <!-- Add your devotional content here -->
          <table class="paleBlueRows">
            <margin>
            </margin>
              <thead>
          <tr>
          <th>Speaker</th>
          <th>Title</th>
          <th>Location</th>
          <th>Year</th>
          </tr>
          </thead>
          <tbody>
          <tr>
          <td>Brad Wilcox</td>
          <td>His Grace is Sufficient</td>
          <td>BYU</td>
          <td>2011</td>
          </tr>
          <tr>
          <td>David A. Bednar</td>
          <td>BYU-Idaho: A Disciple Preparation Center</td>
          <td>BYUI</td>
          <td>2004</td>
          </tr>
          <tr>
          <td>Sam Brubaker</td>
          <td>Learning to Learn as a Disciple of Jesus Christ</td>
          <td>BYUI</td>
          <td>2022</td>
          </tr>
          </tbody>
          </table>
          <form>
            <label for="speaker">Speaker:</label>
            <input type="text" id="speaker" name="speaker" required><br><br>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required><br><br>
            <label for="location">Location:</label>
            <input type="text" id="location" name="location" required><br><br>
            <label for="year">Year:</label>
            <input type="number" id="year" name="year" required><br><br>
            <input type="submit" value="Add Devotional">
          </form>
      </div>
    </main>
  </div>
</body>
</html>
